[package]
name = "mogeung-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mogeung"
path = "src/main.rs"

[dependencies]
mogeung-core.workspace = true
mogeungd.workspace = true
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing-subscriber.workspace = true

eframe = "0.35"
egui.workspace = true
egui-term.workspace = true
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
global-hotkey = "0.8.0"
egui_commonmark = { version = "0.24.0", default-features = false, features = ["pulldown_cmark"] }
egui_tiles = "0.16"

# Deliberately its own workspace root, not a member of the one at the repo
# root. Two reasons, and the second is the important one:
#
#  1. Tauri needs `libwebkit2gtk-4.1-dev` on Linux, which is not installed
#     everywhere the daemon is developed.
#  2. If this were a workspace member, a missing system dependency would break
#     `cargo build --workspace` and `cargo test --workspace` for the daemon —
#     the two commands CLAUDE.md requires to pass before handing work back.
#     The desktop shell must not be able to take those down.
[workspace]

[package]
name = "mogeung-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[lib]
name = "mogeung_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `devtools` in release builds too, deliberately. Tauri gates the inspector
# behind this feature and enables it only for debug builds otherwise — which is
# right for an app you ship to strangers and wrong for this one. mogeung is a
# developer tool whose window hosts other developers' terminals; when it draws
# something wrong, the difference between *looking* and *guessing* was, on
# 2026-09-06, two reinstalls and an afternoon (`R-J89`).
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
anyhow = "1"

# The daemon, as a library. This is what lets one executable be enough
# (ADR-0009): with nothing on the port the window hosts a daemon on a thread,
# exactly as the egui client does. A path dependency out of this workspace is
# fine — `mogeungd` is a normal crate and does not drag webkit in with it.
mogeungd = { path = "../../crates/mogeungd" }
# Its types, for the daemon options this window builds — `R-O1`'s model
# settings are the first field here that is not a primitive.
mogeung-core = { path = "../../crates/mogeung-core" }
tokio = { version = "1", features = ["rt-multi-thread"] }
tauri-plugin-dialog = "2.7.2"
# The clipboard *write*, and only the write (see `capabilities/default.json`).
# WebKitGTK lets `navigator.clipboard.writeText` run only inside a user
# gesture, and an `OSC 52` arrives over the pty long after the mouse-up that
# caused it — so tmux's copy-on-select reached the window and was refused
# there. The shell has no such gate. Read stays with the webview on purpose:
# a pty that could read the clipboard is a remote session reading this
# machine's (`R-I6`).
tauri-plugin-clipboard-manager = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
